 Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pthfndr-app

on:
  push:
    branches:
      - content-fixes-aug-2026
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        env:
          VITE_SUPABASE_URL: ${{https://jotrvvgqbewfhcymzkhh.supabase.co}}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{sb_publishable_omiJslYnrwdPuoOutfoGHw_ZLenbL-R}}

        run: |
        npm install
        npm run build --if-present
        npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4FE727179A8941FDBD6812EB11D21444 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CA87BE9615314CAAA8D3ED4F00AA1F5C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0836869080C148F8B4ED7B0F875C4C16 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pthfndr-app'
          slot-name: 'Production'
          package: .
          
